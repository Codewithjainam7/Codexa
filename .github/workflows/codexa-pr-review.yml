name: "Codexa PR Security Reviewer & Bot"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  codexa-audit:
    name: "Codexa Autonomous PR Review"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Target Base Branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Codexa Static PR Audit
        id: codexa_audit
        env:
          BASE_REF: "origin/${{ github.base_ref }}"
          HEAD_REF: "HEAD"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MIN_READINESS_SCORE: "85"
        run: |
          node scripts/codexa-pr-reviewer.js
        continue-on-error: true

      - name: Post Inline Review Comments & Suggestions to PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('codexa-pr-review-payload.json')) {
              console.log('No review payload generated.');
              return;
            }

            const payload = JSON.parse(fs.readFileSync('codexa-pr-review-payload.json', 'utf8'));
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            try {
              // 1. Submit cohesive GitHub PR Review with inline comments
              if (payload.comments && payload.comments.length > 0) {
                console.log(`Submitting PR review with ${payload.comments.length} inline suggestion comments...`);
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number,
                  commit_id: context.payload.pull_request.head.sha,
                  body: payload.body,
                  event: payload.event,
                  comments: payload.comments
                });
              } else {
                // Post clean pass summary comment if no inline comments
                console.log('No inline findings detected. Posting audit summary comment...');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body: payload.body
                });
              }
            } catch (err) {
              console.warn('Error submitting full review with comments:', err.message);
              // Fallback to top-level PR comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: payload.body
              });
            }

      - name: Enforce Codexa Production Readiness Gate
        run: |
          if [ "${{ steps.codexa_audit.outcome }}" != "success" ]; then
            echo "🛑 Codexa PR Audit Gating Failed: Critical security vulnerabilities detected or readiness score below 85."
            exit 1
          fi
          echo "✅ Codexa PR Audit Passed: All security and quality gates satisfied."
