<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codexa Security Auditor</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .badge {
      font-size: 10px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }
    .description {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: white;
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="status-dot"></span>
      <span>CODEXA</span>
      <span class="badge">v2.4</span>
    </div>
    <span style="font-size: 11px; color: #10b981; font-weight: 600;">ONLINE</span>
  </div>

  <div class="description">
    Deterministic AST static analysis &amp; security gate. Audit any public GitHub repository or test vulnerability patterns in the interactive sandbox.
  </div>

  <button id="btn-scan" class="btn">Audit Current Repository</button>
  <button id="btn-playground" class="btn btn-secondary">Open Security Playground</button>
  <button id="btn-dashboard" class="btn btn-secondary">Open Full Platform</button>

  <div class="footer">
    Production Readiness Platform &bull; Powered by Codexa
  </div>

  <script src="popup.js"></script>
</body>
</html>
