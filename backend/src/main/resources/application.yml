spring:
  application:
    name: codexa-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 3072MB
      max-request-size: 3500MB
      enabled: true

server:
  port: 8080
  shutdown: graceful

codexa:
  limits:
    max-compressed-size-mb: 3072
    max-extracted-size-mb: 4000
    max-file-count: 50000
    max-path-depth: 30
    max-single-file-size-mb: 500
  staging:
    base-dir: .staging
    cleanup-on-completion: true
  ai:
    enabled: ${CODEXA_AI_ENABLED:true}
    provider: ${CODEXA_AI_PROVIDER:openrouter}
    endpoint: ${CODEXA_AI_ENDPOINT:https://openrouter.ai/api/v1/chat/completions}
    model: ${CODEXA_AI_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
    fallback-model: ${CODEXA_AI_FALLBACK_MODEL:nvidia/nemotron-3.5-lightning:free}
    api-key: ${OPENROUTER_API_KEY:${NVIDIA_API_KEY:}}
    timeout-ms: 30000
  security:
    allowed-origins: ${CODEXA_ALLOWED_ORIGINS:http://localhost:5173,https://codexa-ye85.onrender.com}
    rate-limit-enabled: ${CODEXA_RATE_LIMIT_ENABLED:true}
    rate-limit-requests-per-minute: ${CODEXA_RATE_LIMIT_RPM:60}
    trusted-proxies: ${CODEXA_TRUSTED_PROXIES:}
    api-key: ${CODEXA_API_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
