spring:
  application:
    name: codexa-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 300MB
      enabled: true

server:
  port: 8080
  shutdown: graceful

codexa:
  limits:
    max-compressed-size-mb: 250
    max-extracted-size-mb: 500
    max-file-count: 5000
    max-path-depth: 30
    max-single-file-size-mb: 50
  staging:
    base-dir: .staging
    cleanup-on-completion: true
  ai:
    enabled: ${CODEXA_AI_ENABLED:true}
    provider: ${CODEXA_AI_PROVIDER:openrouter}
    endpoint: ${CODEXA_AI_ENDPOINT:https://openrouter.ai/api/v1/chat/completions}
    model: ${CODEXA_AI_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
    fallback-model: ${CODEXA_AI_FALLBACK_MODEL:nvidia/nemotron-3.5-lightning:free}
    api-key: ${OPENROUTER_API_KEY:${NVIDIA_API_KEY:}}
    timeout-ms: 30000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
