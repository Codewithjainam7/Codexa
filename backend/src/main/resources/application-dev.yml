spring:
  datasource:
    url: jdbc:h2:mem:codexadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.codexa: DEBUG
    org.springframework.web: INFO

codexa:
  ai:
    enabled: true
    provider: openrouter
    endpoint: https://openrouter.ai/api/v1/chat/completions
    model: anthropic/claude-fable-5.1
    api-key: ${OPENROUTER_API_KEY:${NVIDIA_API_KEY:}}
    timeout-ms: 30000
